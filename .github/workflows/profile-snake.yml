name: Update contribution snake

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p profile-assets
      - name: Generate growing contribution snake
        uses: dahan8473/snake-and-commits@4ec3eec8531727c9679cd9f8e1c7d60ba1dc7b23
        with:
          github_user: ${{ github.repository_owner }}
          output: ${{ runner.temp }}/github-contribution-grid-snake.svg
          theme: green
          counter: "false"
      - name: Create light and dark theme images
        run: >-
          python3 .github/scripts/prepare_snake.py
          "$RUNNER_TEMP/github-contribution-grid-snake.svg"
          profile-assets/github-contribution-grid-snake-dark.svg
          profile-assets/github-contribution-grid-snake.svg
      - name: Commit generated snake images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/github-contribution-grid-snake.svg profile-assets/github-contribution-grid-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution snake"
            git push
          fi
