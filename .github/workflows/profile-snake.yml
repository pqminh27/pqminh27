name: Update contribution snake

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p profile-assets
      - name: Generate growing contribution snake
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/generate_snake.py
          --user "${{ github.repository_owner }}"
          --output "$RUNNER_TEMP/github-contribution-grid-snake.svg"
          --theme green
          --no-counter
      - name: Create light and dark theme images
        run: >-
          python3 .github/scripts/prepare_snake.py
          "$RUNNER_TEMP/github-contribution-grid-snake.svg"
          profile-assets/github-contribution-grid-snake-dark.svg
          profile-assets/github-contribution-grid-snake.svg
      - name: Commit generated snake images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/github-contribution-grid-snake.svg profile-assets/github-contribution-grid-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution snake"
            git push
          fi
