name: Update contribution snake

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p profile-assets
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-assets/github-contribution-grid-snake.svg
            profile-assets/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Commit generated snake images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/github-contribution-grid-snake.svg profile-assets/github-contribution-grid-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution snake"
            git push
          fi
